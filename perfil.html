<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Editar Perfil</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <img src="img/avatar.png" alt="Foto do usuário">
      <span>João da Silva</span>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb">Home / Editar Perfil</p>

      <div class="cartao">

        <h2>Editar Perfil</h2>

        <form>

          <div class="campo">
            <label>Email *</label>
            <input type="text" value="joaodasilva@pet.com">
          </div>

          <div class="campo">
            <label>Nome *</label>
            <input type="text" value="João">
          </div>

          <div class="campo">
            <label>Sobrenome</label>
            <input type="text" value="da Silva">
          </div>

          <div class="campo">
            <label>Telefone *</label>
            <input type="text" value="+55 (73) 99876-8943">
          </div>

          <div class="campo">
            <label>Foto</label>
            <input type="file">
          </div>

          <div class="form-botoes">
            <button class="botao-salvar">Salvar</button>
            <button class="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

</body>
</html>
