<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Reservas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / Reservas</p>

      <div class="cartao">

        <h2>Reservas</h2>

        <a href="nova-reserva.html" class="botao-novo">+ Nova reserva</a>

        <form class="pesquisa" id="form-pesquisa">

          <div class="campo">
            <label for="busca-id">Id</label>
            <input type="text" id="busca-id">
          </div>

          <div class="campo">
            <label for="busca-inicio">período</label>
            <div class="periodo">
              <input type="date" id="busca-inicio" title="De">
              <input type="date" id="busca-fim" title="Até">
            </div>
          </div>

          <div class="campo">
            <label for="busca-proprietario">proprietário</label>
            <input type="text" id="busca-proprietario">
          </div>

          <div class="campo">
            <label for="busca-total-min">Total</label>
            <div class="periodo">
              <input type="text" id="busca-total-min" placeholder="R$ 0,00" title="Mínimo">
              <input type="text" id="busca-total-max" placeholder="R$ 0,00" title="Máximo">
            </div>
          </div>

          <div class="campo">
            <label for="busca-status">status</label>
            <select id="busca-status">
              <option></option>
              <option>Reservada</option>
              <option>Em andamento</option>
              <option>Finalizada</option>
              <option>Cancelada</option>
            </select>
          </div>

          <div class="campo">
            <label for="busca-pet">pet</label>
            <input type="text" id="busca-pet">
          </div>

          <div class="pesquisa-botoes">
            <button type="submit" class="botao-azul">Pesquisar</button>
            <button type="button" class="botao-branco" id="limpar-pesquisa">Limpar</button>
          </div>

        </form>

        <table class="tabela">
          <thead>
            <tr>
              <th></th>
              <th>Id</th>
              <th>Pet</th>
              <th>chegada</th>
              <th>partida</th>
              <th>status</th>
              <th>total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-reservas"></tbody>
        </table>

        <p id="lista-vazia" class="lista-vazia" hidden>Nenhuma reserva encontrada.</p>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/reservas.js"></script>

</body>
</html>
