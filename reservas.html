<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Reservas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / Reservas</p>

      <div class="cartao">

        <h2>Reservas</h2>

        <a href="nova-reserva.html" class="botao-novo">+ Nova reserva</a>

        <div class="pesquisa">

          <div class="campo">
            <label>Id</label>
            <input type="text">
          </div>

          <div class="campo">
            <label>período</label>
            <input type="date">
            <input type="date">
          </div>

          <div class="campo">
            <label>proprietário</label>
            <input type="text">
          </div>

          <div class="campo">
            <label>Total</label>
            <input type="text" value="R$ 0,00">
            <input type="text" value="R$ 0,00">
          </div>

          <div class="campo">
            <label>status</label>
            <select>
              <option></option>
              <option>Reservada</option>
              <option>Em progresso</option>
              <option>Finalizada</option>
            </select>
          </div>

          <div class="campo">
            <label>pet</label>
            <input type="text">
          </div>

          <div class="pesquisa-botoes">
            <button class="botao-azul">Pesquisar</button>
            <button class="botao-branco">Limpar</button>
          </div>

        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th></th>
              <th>Id</th>
              <th>Pet</th>
              <th>chegada</th>
              <th>partida</th>
              <th>status</th>
              <th>total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-reservas"></tbody>
        </table>

        <p id="lista-vazia" class="lista-vazia" hidden>Nenhuma reserva encontrada.</p>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/reservas.js"></script>

</body>
</html>
