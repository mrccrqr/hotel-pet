<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Editar Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html" class="ativo">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / <a href="pets.html">Pet</a> / Editar Pet</p>

      <div class="cartao">

        <h2>Editar Pet</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <form id="form-pet">

          <div class="form-pet">

            <div class="form-campos">

              <div class="campo">
                <label for="pet-dono">Proprietário *</label>
                <select id="pet-dono">
                  <option value=""></option>
                </select>
              </div>

              <div class="campo">
                <label for="pet-nome">Nome *</label>
                <input type="text" id="pet-nome">
              </div>

              <div class="campo">
                <label for="pet-tipo">Tipo *</label>
                <select id="pet-tipo">
                  <option></option>
                  <option>Cachorro</option>
                  <option>Gato</option>
                </select>
              </div>

              <div class="campo">
                <label for="pet-raca">Raça *</label>
                <input type="text" id="pet-raca">
              </div>

              <div class="campo">
                <label for="pet-tamanho">Tamanho *</label>
                <select id="pet-tamanho">
                  <option></option>
                  <option>Pequeno</option>
                  <option>Médio</option>
                  <option>Grande</option>
                </select>
              </div>

            </div>

            <div class="form-imagem">
              <label for="pet-foto">Imagem</label>
              <img src="img/placeholder.png" alt="Imagem do pet" id="preview-foto">
              <input type="file" id="pet-foto" accept="image/*" class="input-imagem">
            </div>

          </div>

          <div class="form-botoes">
            <button type="button" class="botao-salvar" id="botao-salvar">Salvar</button>
            <button type="button" class="botao-limpar" id="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/editar-pet.js"></script>

</body>
</html>
