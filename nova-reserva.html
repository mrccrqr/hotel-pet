<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Fazer reserva</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <img src="img/avatar.png" alt="Foto do usuário">
      <span>João da Silva</span>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb">Home / reservas / nova reserva</p>

      <div class="cartao">

        <h2>Fazer reserva</h2>

        <form>

          <div class="campo">
            <label>Pet *</label>
            <input type="text" value="Max">
          </div>

          <div class="campo">
            <label>Período *</label>
            <input type="date">
            <input type="date">
          </div>

          <div class="campo">
            <label>Notas</label>
            <textarea></textarea>
          </div>

          <p class="total">Total das diárias: <span>R$ 40,00</span></p>

          <div class="form-botoes">
            <button class="botao-salvar">Salvar</button>
            <button class="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

</body>
</html>
