<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Pets</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html" class="ativo">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / Pets</p>

      <div class="cartao">

        <h2>Pets</h2>

        <a href="novo-pet.html" class="botao-novo">+ Novo Pet</a>

        <form class="pesquisa" id="form-pesquisa">

          <div class="campo">
            <label for="busca-id">Id</label>
            <input type="text" id="busca-id">
          </div>

          <div class="campo">
            <label for="busca-raca">raça</label>
            <input type="text" id="busca-raca">
          </div>

          <div class="campo">
            <label for="busca-nome">nome</label>
            <input type="text" id="busca-nome">
          </div>

          <div class="campo">
            <label for="busca-tamanho">tamanho</label>
            <select id="busca-tamanho">
              <option></option>
              <option>Pequeno</option>
              <option>Médio</option>
              <option>Grande</option>
            </select>
          </div>

          <div class="pesquisa-botoes">
            <button type="submit" class="botao-azul">Pesquisar</button>
            <button type="button" class="botao-branco" id="limpar-pesquisa">Limpar</button>
          </div>

        </form>

        <table class="tabela">
          <thead>
            <tr>
              <th></th>
              <th>Id</th>
              <th>nome</th>
              <th>tipo</th>
              <th>raça</th>
              <th>tamanho</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-pets"></tbody>
        </table>

        <p id="lista-vazia" class="lista-vazia" hidden>Nenhum pet encontrado.</p>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/pets.js"></script>

</body>
</html>
