<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Novo usuário</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html" class="ativo">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / <a href="usuarios.html">Usuário</a> / <span id="breadcrumb-atual">Novo usuário</span></p>

      <div class="cartao">

        <h2 id="titulo">Novo usuário</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <form id="form-usuario">

          <div class="campo">
            <label for="usuario-email">Email *</label>
            <input type="text" id="usuario-email">
          </div>

          <div class="campo">
            <label for="usuario-nome">Nome *</label>
            <input type="text" id="usuario-nome">
          </div>

          <div class="campo">
            <label for="usuario-sobrenome">Sobrenome</label>
            <input type="text" id="usuario-sobrenome">
          </div>

          <div class="campo">
            <label for="usuario-telefone">Telefone *</label>
            <input type="text" id="usuario-telefone">
          </div>

          <div class="campo">
            <label for="usuario-funcao">Função</label>
            <select id="usuario-funcao">
              <option>Cliente</option>
              <option>Funcionário</option>
              <option>Gerente</option>
            </select>
          </div>

          <div class="campo">
            <label for="usuario-foto">Foto</label>
            <img src="img/avatar.png" alt="Foto do usuário" class="preview-avatar" id="preview-foto">
            <input type="file" id="usuario-foto" accept="image/*">
          </div>

          <div class="form-botoes">
            <button type="button" class="botao-salvar" id="botao-salvar">Salvar</button>
            <button type="button" class="botao-limpar" id="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/novo-usuario.js"></script>

</body>
</html>
