<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Editar reserva</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / <a href="reservas.html">reservas</a> / editar reserva</p>

      <div class="cartao">

        <h2>Editar reserva</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <form id="form-reserva">

          <div class="campo">
            <label for="reserva-proprietario">Proprietário *</label>
            <input type="text" id="reserva-proprietario" disabled>
          </div>

          <div class="campo">
            <label for="reserva-pet">Pet *</label>
            <select id="reserva-pet">
              <option value=""></option>
            </select>
          </div>

          <div class="campo">
            <label for="reserva-chegada">Período *</label>
            <div class="periodo">
              <input type="date" id="reserva-chegada" title="Chegada">
              <input type="date" id="reserva-partida" title="Partida">
            </div>
          </div>

          <div class="campo">
            <label for="reserva-notas">Notas</label>
            <textarea id="reserva-notas"></textarea>
          </div>

          <div class="campo">
            <label for="reserva-status">Status *</label>
            <select id="reserva-status">
              <option>Reservada</option>
              <option>Em andamento</option>
              <option>Cancelada</option>
              <option>Finalizada</option>
            </select>
          </div>

          <div class="campo">
            <label for="reserva-anotacoes">Anotações do funcionário</label>
            <textarea id="reserva-anotacoes"></textarea>
          </div>

          <div class="imagens-reserva" id="reserva-imagens">
            <a href="#" class="add-imagem" id="add-imagem" title="Adicionar imagem">+</a>
          </div>

          <p class="total">Total das diárias: <span id="reserva-total">R$ 0,00</span></p>

          <div class="form-botoes">
            <button type="button" class="botao-salvar" id="botao-salvar">Salvar</button>
            <button type="button" class="botao-limpar" id="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/editar-reserva.js"></script>

</body>
</html>
