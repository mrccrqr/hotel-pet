<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Configurações</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <img src="img/avatar.png" alt="Foto do usuário">
      <span>João da Silva</span>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html" class="ativo">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb">Home / Configurações</p>

      <div class="cartao">

        <h2>Configurações</h2>

        <form>

          <div class="campo">
            <label>Valor da diária</label>
            <input type="text" value="R$ 10,00">
          </div>

          <div class="campo">
            <label>Vagas disponíveis</label>
            <input type="text" value="3">
          </div>

          <div class="form-botoes">
            <button class="botao-salvar">Salvar</button>
            <button class="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

</body>
</html>
