<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Configurações</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html" class="ativo">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / Configurações</p>

      <div class="cartao">

        <h2>Configurações</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <form id="form-configuracoes">

          <div class="campo">
            <label for="config-diaria">Valor da diária</label>
            <input type="text" id="config-diaria" inputmode="decimal">
          </div>

          <div class="campo">
            <label for="config-vagas">Vagas disponíveis</label>
            <input type="text" id="config-vagas" inputmode="numeric">
          </div>

          <div class="form-botoes">
            <button type="button" class="botao-salvar" id="botao-salvar">Salvar</button>
            <button type="button" class="botao-limpar" id="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/configuracoes.js"></script>

</body>
</html>
