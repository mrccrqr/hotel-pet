<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Novo Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <img src="img/avatar.png" alt="Foto do usuário">
      <span>João da Silva</span>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html" class="ativo">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb">Home / Pet / Novo Pet</p>

      <div class="cartao">

        <h2>Novo Pet</h2>

        <form>

          <div class="form-pet">

            <div class="form-campos">

              <div class="campo">
                <label>Proprietário *</label>
                <input type="text">
              </div>

              <div class="campo">
                <label>Nome *</label>
                <input type="text">
              </div>

              <div class="campo">
                <label>Tipo *</label>
                <select>
                  <option></option>
                  <option>Cachorro</option>
                  <option>Gato</option>
                </select>
              </div>

              <div class="campo">
                <label>Raça *</label>
                <input type="text">
              </div>

              <div class="campo">
                <label>Tamanho *</label>
                <select>
                  <option></option>
                  <option>Pequeno</option>
                  <option>Médio</option>
                  <option>Grande</option>
                </select>
              </div>

            </div>

            <div class="form-imagem">
              <label>Imagem</label>
              <img src="img/placeholder.png" alt="Imagem do pet">
            </div>

          </div>

          <div class="form-botoes">
            <button class="botao-salvar">Salvar</button>
            <button class="botao-limpar">Limpar</button>
          </div>

        </form>

      </div>

    </div>

  </div>

</body>
</html>
