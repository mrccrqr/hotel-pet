<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Ver pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html" class="ativo">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / <a href="pets.html">pets</a> / ver pet</p>

      <div class="cartao">

        <h2>Ver pet</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <div class="acoes-topo">
          <a href="#" id="link-editar" class="botao-branco">Editar</a>
          <a href="#" id="botao-deletar" class="botao-branco">Deletar</a>
        </div>

        <table class="detalhes">
          <tr><td class="rotulo">Proprietário:</td><td id="ver-proprietario"></td></tr>
          <tr><td class="rotulo">Id:</td><td id="ver-id"></td></tr>
          <tr><td class="rotulo">Nome:</td><td id="ver-nome"></td></tr>
          <tr><td class="rotulo">Tipo:</td><td id="ver-tipo"></td></tr>
          <tr><td class="rotulo">Raça:</td><td id="ver-raca"></td></tr>
          <tr><td class="rotulo">Tamanho:</td><td id="ver-tamanho"></td></tr>
          <tr>
            <td class="rotulo">Imagem:</td>
            <td><img src="img/placeholder.png" alt="Imagem do pet" class="img-pet" id="ver-foto"></td>
          </tr>
          <tr>
            <td class="rotulo">Reservas:</td>
            <td id="ver-reservas"></td>
          </tr>
        </table>

        <a href="pets.html" class="botao-voltar">← Voltar</a>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/ver-pet.js"></script>

</body>
</html>
