<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Ver reserva</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / <a href="reservas.html">reservas</a> / ver reserva</p>

      <div class="cartao">

        <h2>Ver reserva</h2>

        <p id="mensagem" class="mensagem" hidden></p>

        <div class="acoes-topo">
          <a href="#" id="link-editar" class="botao-branco">Editar</a>
        </div>

        <table class="detalhes">
          <tr><td class="rotulo">Id:</td><td id="ver-id"></td></tr>
          <tr><td class="rotulo">Proprietário:</td><td id="ver-proprietario"></td></tr>
          <tr><td class="rotulo">Pet:</td><td id="ver-pet"></td></tr>
          <tr><td class="rotulo">Chegada:</td><td id="ver-chegada"></td></tr>
          <tr><td class="rotulo">Partida:</td><td id="ver-partida"></td></tr>
          <tr><td class="rotulo">Notas:</td><td id="ver-notas"></td></tr>
          <tr><td class="rotulo">Anotações dos Funcionários:</td><td id="ver-anotacoes"></td></tr>
          <tr id="linha-imagens">
            <td class="rotulo">Imagens:</td>
            <td id="ver-imagens"></td>
          </tr>
          <tr><td class="rotulo">Status:</td><td id="ver-status"></td></tr>
          <tr><td class="rotulo">Total das diárias:</td><td id="ver-total"></td></tr>
          <tr id="linha-recibo"><td class="rotulo">Recibo:</td><td id="ver-recibo"></td></tr>
          <tr><td class="rotulo">Criado em:</td><td id="ver-criado"></td></tr>
          <tr><td class="rotulo">Atualizado em:</td><td id="ver-atualizado"></td></tr>
        </table>

        <a href="reservas.html" class="botao-voltar">← Voltar</a>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/ver-reserva.js"></script>

</body>
</html>
