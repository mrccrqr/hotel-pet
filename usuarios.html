<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet - Usuários</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <div class="logo">Hotel Pet</div>
    <div class="usuario">
      <a href="perfil.html" class="usuario-link" title="Editar perfil">
        <img src="img/avatar.png" alt="Foto do usuário" id="foto-usuario">
        <span id="nome-usuario">João da Silva</span>
      </a>
      <a href="#" id="sair" class="sair">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="menu-lateral">
      <ul>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html" class="ativo">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="reservas.html">Reservas</a></li>
      </ul>
    </div>

    <div class="conteudo">

      <p class="breadcrumb"><a href="reservas.html">Home</a> / Usuários</p>

      <div class="cartao">

        <h2>Usuários</h2>

        <div class="acoes-topo">
          <a href="novo-usuario.html" class="botao-novo">novo</a>
          <button class="botao-branco">Remover</button>
          <button class="botao-branco">Mudar status</button>
        </div>

        <p class="visualizar-por">Visualizar Por:
          <a href="#" class="tag-ativa" id="ver-por-usuarios">Usuários</a>
          <a href="#" class="tag" id="ver-por-funcao">Função</a>
        </p>

        <form class="pesquisa" id="form-pesquisa">

          <div class="campo">
            <label for="busca-id">Id</label>
            <input type="text" id="busca-id">
          </div>

          <div class="campo">
            <label for="busca-inicio">criado em</label>
            <div class="periodo">
              <input type="date" id="busca-inicio" title="De">
              <input type="date" id="busca-fim" title="Até">
            </div>
          </div>

          <div class="campo">
            <label for="busca-email">email</label>
            <input type="text" id="busca-email">
          </div>

          <div class="campo">
            <label for="busca-nome">nome</label>
            <input type="text" id="busca-nome">
          </div>

          <div class="campo">
            <label for="busca-status">status</label>
            <select id="busca-status">
              <option></option>
              <option>Ativo</option>
              <option>Inativo</option>
            </select>
          </div>

          <div class="campo">
            <label for="busca-funcao">função</label>
            <select id="busca-funcao">
              <option></option>
              <option>Cliente</option>
              <option>Funcionário</option>
              <option>Gerente</option>
            </select>
          </div>

          <div class="pesquisa-botoes">
            <button type="submit" class="botao-azul">Pesquisar</button>
            <button type="button" class="botao-branco" id="limpar-pesquisa">Limpar</button>
          </div>

        </form>

        <table class="tabela">
          <thead>
            <tr>
              <th></th>
              <th>Foto</th>
              <th>Id</th>
              <th>email</th>
              <th>nome</th>
              <th>função</th>
              <th>status</th>
              <th>criado em</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista-usuarios"></tbody>
        </table>

        <p id="lista-vazia" class="lista-vazia" hidden>Nenhum usuário encontrado.</p>

      </div>

    </div>

  </div>

  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/usuarios.js"></script>

</body>
</html>
